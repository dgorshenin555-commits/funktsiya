<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Функция — Личный кабинет (исходник для дизайна)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
/* ============================================================
   БАЗА. Дизайн-токены .fx и все классы кабинета — ниже,
   в инлайн-копии orders.css (раздел «Заявки», скоуп .fx).
   Правьте дизайн прямо здесь и возвращайте CSS.
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #08080c; color: #f3f3f7;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }

/* демо-обвязка: переключатель ролей (НЕ часть дизайна кабинета) */
.demo-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px;
  padding: 12px 24px; background: rgba(8,8,12,.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,.08); }
.demo-bar__t { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: #9495a4; }
.demo-seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px;
  background: #1a1a28; border: 1px solid rgba(255,255,255,.1); }
.demo-seg button { height: 32px; padding: 0 16px; border-radius: 999px; border: none; background: transparent;
  color: #9495a4; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; }
.demo-seg button.on { background: linear-gradient(135deg,#8b6cf2,#ab87ff); color: #fff; }
.demo-bar__hint { margin-left: auto; font-size: 12px; color: #62636f; }
.demo-page { max-width: 1080px; margin: 0 auto; padding: 28px 32px 90px; }
.fx a { color: inherit; text-decoration: none; }
.demo-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 99;
  padding: 11px 18px; border-radius: 12px; background: #1a1a28; border: 1px solid rgba(255,255,255,.14);
  color: #f3f3f7; font-size: 13.5px; box-shadow: 0 18px 50px -18px rgba(0,0,0,.7); }

/* ===================== orders.css (.fx) — инлайн ===================== */
/* orders.css — раздел «Заявки». Заскоуплено под .fx (CSS-шов).
   Сгенерировано из выгрузки Cloud Design: styles.css(:root) + components.css + layouts.css. */

.fx {
  
  --bg:          #08080c;
  --bg-2:        #0b0b11;   
  --surface:     #131320;   
  --surface-2:   #1a1a28;   
  --surface-3:   #22222f;   
  --border:      rgba(255,255,255,.07);
  --border-2:    rgba(255,255,255,.12);

  
  --text:        #f3f3f7;
  --text-dim:    #9495a4;
  --text-mute:   #62636f;

  
  --accent:      #8b6cf2;
  --accent-2:    #ab87ff;
  --accent-soft: rgba(139,108,242,.14);
  --accent-line: rgba(139,108,242,.34);
  --grad:        linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);

  
  --green:  #34d399;
  --blue:   #5b9dff;
  --amber:  #f5b13d;
  --red:    #f4717f;
  --pink:   #f06ea9;

  
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

  
  --r-xs: 7px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;

  
  --shadow:   0 18px 50px -18px rgba(0,0,0,.7);
  --shadow-sm:0 8px 24px -12px rgba(0,0,0,.6);
  --glow:     0 0 0 1px var(--accent-line), 0 14px 40px -16px rgba(139,108,242,.5);

  --sidebar-w: 260px;
  --topbar-h:  64px;
}

.fx, .fx * { box-sizing: border-box; }
.fx { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

/* === components.css === */
.fx .app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}
.fx .sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.fx .sidebar__brand {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 22px 22px 20px;
  cursor: pointer;
  user-select: none;
  transition: opacity .15s;
}
.fx .sidebar__brand:hover, .fx .brand-link:hover { opacity: .82; }
.fx .brand__logo {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--grad);
  display: grid; place-items: center;
  color: #fff;
  box-shadow: 0 8px 22px -8px var(--accent);
  flex-shrink: 0;
}
.fx .brand__name {
  font-weight: 800;
  font-size: 19px;
  letter-spacing: .14em;
  color: #fff;
}
.fx .sidebar__nav { padding: 6px 14px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; flex: 1; min-height: 0; }
.fx .navitem {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 13px;
  border-radius: var(--r-sm);
  color: var(--text-dim);
  font-size: 14.5px; font-weight: 500;
  background: none; border: none; width: 100%; text-align: left;
  position: relative;
  transition: background .16s, color .16s;
}
.fx .navitem svg { width: 19px; height: 19px; flex-shrink: 0; opacity: .85; }
.fx .navitem:hover { background: rgba(255,255,255,.04); color: var(--text); }
.fx .navitem.is-active { background: var(--accent-soft); color: var(--accent-2); }
.fx .navitem.is-active svg { opacity: 1; }
.fx .navitem.is-active::before {
  content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--grad);
}
.fx .sidebar__foot {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
}
.fx .avatar {
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700; color: #fff; flex-shrink: 0;
  background: var(--grad);
  font-size: 13px;
}
.fx .sidebar__foot .meta-name { font-size: 14px; font-weight: 600; color: var(--text); }
.fx .sidebar__foot .meta-sub { font-size: 12px; color: var(--text-mute); }
.fx .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.fx .topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 28px;
  background: rgba(11,11,17,.7);
  backdrop-filter: blur(12px);
}
.fx .iconbtn {
  width: 40px; height: 40px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim);
  display: grid; place-items: center;
  transition: background .16s, color .16s, border-color .16s;
}
.fx .iconbtn:hover { background: var(--surface-3); color: var(--text); }
.fx .iconbtn svg { width: 18px; height: 18px; }
.fx .topbar__search {
  flex: 1; max-width: 480px;
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 11px; padding: 0 14px; height: 40px;
  color: var(--text-mute);
}
.fx .topbar__search svg { width: 16px; height: 16px; }
.fx .topbar__search input { background: none; border: none; outline: none; color: var(--text); flex: 1; font-size: 14px; }
.fx .topbar__search input::placeholder { color: var(--text-mute); }
.fx .topbar__user { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-dim); }
.fx .content { flex: 1; overflow-y: auto; min-height: 0; }
.fx .content--flush { overflow: hidden; }
.fx .content__inner { padding: 34px 40px 90px; max-width: 1340px; margin: 0 auto; }
.fx .content__flush { height: 100%; }
.fx .legend {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: rgba(11,11,17,.8);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; gap: 28px;
  height: 46px; font-size: 13px; color: var(--text-dim);
}
.fx .legend span { display: inline-flex; align-items: center; gap: 7px; }
.fx .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.fx .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
.fx .page-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; color: #fff; }
.fx .page-sub { color: var(--text-dim); font-size: 14.5px; margin: 7px 0 0; }
.fx .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-sm); border: 1px solid transparent;
  font-size: 14px; font-weight: 600; padding: 0 18px; height: 42px;
  transition: transform .12s, box-shadow .16s, background .16s, border-color .16s;
  white-space: nowrap;
}
.fx .btn svg { width: 16px; height: 16px; }
.fx .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 10px 26px -12px var(--accent); }
.fx .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 32px -12px var(--accent); }
.fx .btn-ghost { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.fx .btn-ghost:hover { background: var(--surface-3); border-color: var(--border-2); }
.fx .btn-outline { background: transparent; border-color: var(--border-2); color: var(--text-dim); }
.fx .btn-outline:hover { color: var(--text); border-color: var(--accent-line); }
.fx .btn-sm { height: 36px; padding: 0 14px; font-size: 13px; border-radius: var(--r-xs); }
.fx .btn-block { width: 100%; }
.fx .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--card-pad, 24px);
}
.fx .card-hover { transition: border-color .18s, transform .18s, box-shadow .18s; cursor: pointer; }
.fx .card-hover:hover { border-color: var(--accent-line); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.fx .chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: var(--r-xs);
  font-size: 12px; font-weight: 600;
  background: var(--surface-3); color: var(--text-dim);
}
.fx .chip-code { background: rgba(139,108,242,.12); color: var(--accent-2); letter-spacing: .02em; cursor: help; }
.fx .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fx .prev__count { font-size: 15px; font-weight: 800; color: var(--accent-2); }
.fx .prev__rows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.fx .prev__row {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 10px 11px; border-radius: 11px; border: 1px solid transparent;
  animation: prevIn .26s ease both;
}
.fx .prev__row.is-hot {
  background: var(--accent-soft); border-color: var(--accent-line);
}
.fx .prev__ico {
  flex: none; width: 28px; height: 28px; border-radius: 8px; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-dim);
}
.fx .prev__row.is-hot .prev__ico { background: var(--accent); color: #fff; }
.fx .prev__k { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 2px; }
.fx .prev__v { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; word-break: break-word; }
.fx .prev__v--accent { color: var(--accent-2); }
.fx .prev__price { padding-top: 16px; border-top: 1px solid var(--border); }
@keyframes prevIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fx .code-tip {
  position: fixed; z-index: 1000; transform: translate(-50%, -100%);
  max-width: 260px; padding: 9px 12px; border-radius: 10px;
  background: var(--surface-2, #1b1b2b); color: #fff;
  border: 1px solid var(--accent-line, rgba(139,108,242,.34));
  box-shadow: 0 12px 34px rgba(0,0,0,.45);
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity .13s ease, transform .13s ease;
  display: flex; flex-direction: column; gap: 3px;
}
.fx .code-tip.is-below { transform: translate(-50%, 0); }
.fx .code-tip.is-on { opacity: 1; visibility: visible; }
.fx .code-tip b { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--accent-2, #ab87ff); }
.fx .code-tip span { font-size: 13px; line-height: 1.35; color: rgba(255,255,255,.9); }
.fx .code-tip::after {
  content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px;
  background: var(--surface-2, #1b1b2b); border-right: 1px solid var(--accent-line, rgba(139,108,242,.34));
  border-bottom: 1px solid var(--accent-line, rgba(139,108,242,.34));
  transform: translateX(-50%) rotate(45deg);
}
.fx .code-tip.is-below::after { bottom: auto; top: -5px; border: 0; border-left: 1px solid var(--accent-line, rgba(139,108,242,.34)); border-top: 1px solid var(--accent-line, rgba(139,108,242,.34)); }
.fx .badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: 99px;
  font-size: 12.5px; font-weight: 600;
}
.fx .badge i { width: 6px; height: 6px; border-radius: 50%; }
.fx .badge.pub { background: rgba(139,108,242,.14); color: var(--accent-2); }
.fx .badge.pub i { background: var(--accent-2); }
.fx .badge.work { background: rgba(91,157,255,.14); color: var(--blue); }
.fx .badge.work i { background: var(--blue); }
.fx .badge.done { background: rgba(52,211,153,.14); color: var(--green); }
.fx .badge.done i { background: var(--green); }
.fx .badge.wait { background: rgba(245,177,61,.14); color: var(--amber); }
.fx .badge.wait i { background: var(--amber); }
.fx .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; color: var(--text-dim); font-size: 13.5px; }
.fx .meta-row > span { display: inline-flex; align-items: center; gap: 6px; }
.fx .meta-row svg { width: 15px; height: 15px; opacity: .7; }
.fx .field { display: flex; flex-direction: column; gap: 8px; }
.fx .field label { font-size: 13px; font-weight: 600; color: var(--text-dim); }
.fx .input {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); height: 46px; padding: 0 15px;
  color: var(--text); font-size: 14.5px; outline: none; width: 100%;
  transition: border-color .16s, box-shadow .16s;
}
.fx textarea.input { height: auto; padding: 13px 15px; resize: vertical; line-height: 1.5; }
.fx .input::placeholder { color: var(--text-mute); }
.fx .input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.fx .stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 22px 24px;
}
.fx .stat__icon { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; color: var(--accent-2); margin-bottom: 16px; }
.fx .stat__icon svg { width: 19px; height: 19px; }
.fx .stat__num { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
.fx .stat__label { color: var(--text-dim); font-size: 13.5px; margin-top: 4px; }
.fx .delta { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
.fx .delta.up { background: rgba(52,211,153,.12); color: var(--green); }
.fx .delta.down { background: rgba(244,113,127,.12); color: var(--red); }
.fx .delta svg { width: 13px; height: 13px; }
.fx .thumb {
  border-radius: var(--r-md);
  background:
    repeating-linear-gradient(0deg, rgba(120,150,255,.07) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(120,150,255,.07) 0 1px, transparent 1px 22px),
    linear-gradient(150deg, #1b2546 0%, #221a45 55%, #2a1c3e 100%);
  position: relative; overflow: hidden; flex-shrink: 0;
}
.fx .thumb::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 80% 110%, rgba(139,108,242,.4), transparent 60%);
}
.fx .thumb-tower::before {
  content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 46%; height: 70%;
  background:
    repeating-linear-gradient(0deg, rgba(150,180,255,.18) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(150,180,255,.14) 0 2px, transparent 2px 11px),
    linear-gradient(180deg, rgba(120,150,255,.16), rgba(90,110,220,.05));
  border: 1px solid rgba(150,180,255,.2); border-bottom: none;
}
.fx .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.fx .tab {
  background: none; border: none; color: var(--text-dim);
  padding: 13px 18px; font-size: 14.5px; font-weight: 500;
  position: relative; transition: color .16s;
}
.fx .tab:hover { color: var(--text); }
.fx .tab.is-active { color: #fff; font-weight: 600; }
.fx .tab.is-active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--grad); }
.fx .pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 99px; height: 38px; padding: 0 16px;
  font-size: 13.5px; font-weight: 500; transition: background .14s, color .14s, border-color .14s;
}
.fx .pill svg { width: 15px; height: 15px; }
.fx .pill:hover { color: var(--text); border-color: var(--border-2); }
.fx .pill.is-active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-2); }
.fx .viewtoggle { display: flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.fx .viewtoggle button { width: 34px; height: 30px; border-radius: 7px; background: none; border: none; color: var(--text-mute); display: grid; place-items: center; }
.fx .viewtoggle button svg { width: 16px; height: 16px; }
.fx .viewtoggle button.is-active { background: var(--grad); color: #fff; }
.fx .psearch { width: 100%; border: 1px solid var(--border-2); background: var(--surface-2); border-radius: 24px; padding: 8px; transition: border-color .14s; }
.fx .psearch:focus-within { border-color: var(--accent-line); }
.fx .psearch__files { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 4px 8px; }
.fx .psearch__file { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-3); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; color: var(--text-dim); }
.fx .psearch__file svg { width: 15px; height: 15px; flex: none; }
.fx .psearch__file b { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--text); }
.fx .psearch__file button { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: none; background: none; color: var(--text-mute); cursor: pointer; }
.fx .psearch__file button:hover { background: var(--surface-2); color: var(--text); }
.fx .psearch__ta { width: 100%; resize: none; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.5; padding: 11px 12px 7px; outline: none; min-height: 44px; }
.fx .psearch__ta::placeholder { color: var(--text-mute); }
.fx .psearch__bar { display: flex; align-items: center; gap: 8px; padding: 4px; }
.fx .psearch__spacer { margin-left: auto; }
.fx .psearch__act { position: relative; display: grid; place-items: center; cursor: pointer; border: none; }
.fx .psearch__attach { width: 36px; height: 36px; border-radius: 16px; background: transparent; color: var(--text-dim); transition: background .14s, color .14s; }
.fx .psearch__attach:hover { background: var(--surface-3); color: var(--text); }
.fx .psearch__attach svg { width: 19px; height: 19px; }
.fx .psearch__send { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); color: var(--text-mute); transition: background .14s, color .14s; }
.fx .psearch__send.is-on { background: var(--grad); color: #fff; }
.fx .psearch__send:disabled { cursor: default; }
.fx .psearch__send svg { width: 18px; height: 18px; }
.fx .psearch__sq { width: 13px; height: 13px; border-radius: 3px; background: currentColor; }
.fx .psearch__act[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--surface-3); color: var(--text); border: 1px solid var(--border-2); font-size: 12px; white-space: nowrap; padding: 5px 9px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .14s, transform .14s; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.fx .psearch__act[data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

/* prompt box (adapted from ai-prompt-box.tsx) */

.fx .ai-attach { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: transparent; border: none; color: var(--text-dim); cursor: pointer; transition: background .14s, color .14s; }

    getRecommendedOrders: () => orders.filter((o) => o.status === 'published').slice(0, 4),
    getRecommendedExpertise: () => EX_REQUESTS0.slice(0, 4),
    getFavoriteStandards: () => STANDARDS0.filter((s) => favoriteStandards.includes(s.code)),
    toggleFavoriteStandard: (code) => setFav((p) => p.includes(code) ? p.filter((c) => c !== code) : [...p, code]),
    selectExecutor: (orderId, did, dname) => setOrders((p) => p.map((o) => o.id === orderId ? { ...o, status: 'in_progress', assignedDesignerId: did, assignedDesignerName: dname } : o)),
    updateUser: (patch) => setUsers((p) => ({ ...p, [roleKey]: { ...p[roleKey], ...patch } })),
    logout: () => notify('Демо: выход из аккаунта'),
    notify,
  };
  return <AppCtx.Provider value={value}>{children}{toast && <div className="demo-toast">{toast}</div>}</AppCtx.Provider>;
}

function Kpi({ icon, num, label }) {

      <div className="stat__label">{label}</div>

  );
}

function Overview() {

    return (

          <Kpi icon="layers" num={inwork} label="В работе" />

        <Kpi icon="checkCircle" num={done} label="Завершено" />

      <div className="row between" style={{ marginBottom: 16 }}>

        <Link href={isExpert ? '/expertise' : '/orders'} className="btn btn-primary btn-sm">{isExpert ? 'Смотреть обследования' : 'Смотреть заявки'}</Link>

            )}
            <div className="field"><label>О себе</label>
              <textarea className="input" rows={4} placeholder="Краткое описание специализации и опыта" value={description} onChange={(e) => { setDescription(e.target.value); setSaved(false); }} /></div>
          </div>
          <div className="row gap16 mt24">
            <button type="submit" className="btn btn-primary">Сохранить изменения</button>
            {saved && <span className="row gap8" style={{ color: 'var(--green)', fontSize: 14, fontWeight: 600 }}><Icon name="check" size={16} /> Сохранено</span>}
          </div>
        </div>
      </form>

      <div className="card" style={{ marginTop: 24 }}>
        <h3 className="section-title" style={{ marginBottom: 18 }}>Аккаунт</h3>
        <div className="field" style={{ marginBottom: 8 }}><label>Email (логин)</label>
          <input className="input" value={user.email} disabled readOnly style={{ opacity: .7 }} /></div>
        <p className="dim" style={{ fontSize: 13, margin: '0 0 22px' }}>Email используется для входа и не редактируется.</p>
        <hr className="divider" style={{ marginBottom: 20 }} />
        <div className="row between">
          <div style={{ fontWeight: 600, fontSize: 14 }}>Выйти из аккаунта на этом устройстве</div>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => logout()}><Icon name="logout" size={15} /> Выйти</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- контейнер кабинета (адаптация dashboard/page.tsx) ---------- */
function CabinetContent() {
  const { user, logout, getMyOrders } = useApp();
  const grp = roleGroup(user.role);
  const tabs = CABINET_TABS[grp];
  const [tab, setTab] = useState('overview');
  const cur = tabs.find((t) => t.key === tab) ? tab : 'overview';
  const activeOrders = getMyOrders().filter((o) => o.status === 'published').length;

  return (
    <div className="fx animate-in">
      <div className="cab-head">
        <Avatar text={(user.name || 'П').slice(0, 2).toUpperCase()} size={56} />
        <div className="cab-head__body">
          <h1 className="page-title" style={{ margin: 0 }}>Личный кабинет</h1>
          <p className="page-sub" style={{ margin: '4px 0 0' }}>{user.name} · {user.email}{user.company ? ` · ${user.company}` : ''}</p>
        </div>
        <div className="cab-head__meta">
          <span className="badge done"><i />{ROLE_LABEL[user.role] || user.role}</span>
          {grp === 'customer'
            ? <span className="dim" style={{ fontSize: 13 }}>{activeOrders} активных заявок</span>
            : <span className="row gap6" style={{ fontSize: 13, color: 'var(--amber)', fontWeight: 600 }}><Icon name="star" size={14} /> рейтинг —</span>}
        </div>
      </div>

      <div className="tabs cab-tabs">
        {tabs.map((t) => (
          <button key={t.key} className={'tab' + (t.key === cur ? ' is-active' : '')} onClick={() => setTab(t.key)}>
            <Icon name={t.icon} size={15} /> {t.label}
          </button>
        ))}
      </div>

      {cur === 'overview' && <Overview />}
      {cur === 'notifications' && <Notifications />}
      {cur === 'profile' && <>{grp === 'executor' && <ExecPublicCard />}<ProfileForm /></>}
      {cur === 'orders' && <CustomerOrders />}
      {cur === 'responses' && grp === 'customer' && <CustomerResponses />}
      {cur === 'responses' && grp === 'executor' && <ExecResponses />}
      {cur === 'inwork' && <ExecInWork />}
      {cur === 'favorites' && <ExecFavorites />}
    </div>
  );
}

/* ---------- корень: переключатель ролей ---------- */
function Root() {
  const [roleKey, setRoleKey] = useState('customer');
  const ROLES = [['customer', 'Заказчик'], ['designer', 'Проектировщик'], ['expert', 'Инженер-обследователь']];
  return (
    <>
      <div className="demo-bar">
        <span className="demo-bar__t">Личный кабинет · демо</span>
        <div className="demo-seg">
          {ROLES.map(([k, l]) => (
            <button key={k} className={roleKey === k ? 'on' : ''} onClick={() => setRoleKey(k)}>{l}</button>
          ))}
        </div>
        <span className="demo-bar__hint">переключите роль — кабинет перестроится</span>
      </div>
      <div className="demo-page">
        <AppProvider key={roleKey} roleKey={roleKey}>
          <CabinetContent />
        </AppProvider>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
