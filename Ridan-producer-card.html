.prodhead__back:hover { color: var(--accent-2); }
.prodhead__crumb-cur { color: var(--text); font-weight: 600; }
.prodhead__t { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }

/* ── second level: spacious subgroup tab bar ── */
.subtabs { margin-bottom: 24px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 15px 16px 16px; }
.subtabs__h { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.subtabs__h::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--accent-2); }
.subtabs__row { display: flex; flex-wrap: wrap; gap: 9px; }
.subtab { position: relative; display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--border); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); transition: background .14s, border-color .14s, color .14s; }
.subtab:hover:not(:disabled) { background: var(--surface-4, #20222b); border-color: var(--accent-line); }
.subtab.is-on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-2); }
.subtab.is-on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent-2); }
.subtab__n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; background: rgba(255,255,255,.08); font-size: 12px; font-weight: 700; color: var(--text-dim); }
.subtab.is-on .subtab__n { background: var(--accent-2); color: #fff; }
.subtab:disabled { opacity: .4; cursor: default; font-weight: 500; color: var(--text-mute); }

/* sub-section header (grouped view) */
.prodgrp--sub .prodgrp__h { gap: 10px; margin-bottom: 13px; }
.prodgrp__bar { width: 4px; height: 18px; border-radius: 99px; flex: none; background: var(--accent-2); }
.ai-composer.is-thinking, .ai-composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.ai-ta { width: 100%; resize: none; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.5; outline: none; display: block; }
.ai-ta::placeholder { color: var(--text-mute); }
.ai-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.ai-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-mute); }
.ai-bar__right { display: flex; align-items: center; gap: 12px; }
.ai-attach { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: transparent; border: none; color: var(--text-dim); cursor: pointer; transition: background .14s, color .14s; }
.ai-attach:hover { background: var(--surface-3); color: var(--text); }
.ai-send { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--border-2); background: var(--surface-3); color: var(--text-mute); cursor: pointer; transition: background .16s, color .16s, border-color .16s, transform .12s; }
.ai-send:hover { border-color: var(--text-mute); color: var(--text); }
.ai-send.is-on { background: #fff; color: #0b0b12; border-color: #fff; }
.ai-send.is-on:hover { background: #e7e7ea; }
.ai-send:active { transform: scale(.94); }
.ai-send:disabled { opacity: .6; cursor: default; }
.ai-ex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.ai-ex { text-align: left; background: var(--surface-2); border: 1px dashed var(--border-2); color: var(--text-dim);
  border-radius: 99px; padding: 7px 13px; font-size: 12.5px; font-family: inherit; cursor: pointer; transition: color .14s, border-color .14s, background .14s; }
.ai-ex:hover { color: var(--text); border-color: var(--accent-line); background: var(--accent-soft); }
.ai-ex.is-on { color: var(--accent-2); border-style: solid; border-color: var(--accent-line); background: var(--accent-soft); font-weight: 500; }

.ai-answer { margin-top: 26px; transition: opacity .2s; }
.ai-answer.is-dim { opacity: .45; pointer-events: none; }
.ai-understood { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 13px 16px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 28px; }
.ai-understood__l { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; }

.ai-sec { margin-bottom: 30px; }
.ai-sec__h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.ai-sec__ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.ai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 1100px) { .ai-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 680px) { .ai-grid { grid-template-columns: 1fr; } }

/* ИИ-подбор — стартовый (пустой) экран */
.ai-empty { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; margin-top: 4px; animation: aiFade .25s ease; }
@media (max-width: 1000px) { .ai-empty { grid-template-columns: 1fr; } }
.ai-empty__steps { display: flex; flex-direction: column; gap: 12px; }
.ai-empty__step { position: relative; padding: 18px 20px 18px 56px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }
.ai-empty__n { position: absolute; left: 18px; top: 18px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: #fff; background: var(--grad); }
.ai-empty__sic { position: absolute; right: 18px; top: 16px; color: var(--text-mute); }
.ai-empty__step b { display: block; font-size: 14.5px; margin-bottom: 4px; }
.ai-empty__step p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-dim); }
.ai-empty__ex { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px; }
.ai-empty__exh { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 14px; }
.ai-empty__exh svg { color: var(--accent-2); }
.ai-empty__card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-family: inherit; color: var(--text); transition: border-color .14s, background .14s; }
.ai-empty__card:hover { border-color: var(--accent-line); background: var(--surface-3); }
.ai-empty__cic { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.ai-empty__ct { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-empty__ct b { font-size: 13.5px; }
.ai-empty__ct .dim { font-size: 12px; }
.ai-empty__cgo { color: var(--text-mute); flex: none; }

/* ИИ-подбор — состояние «думаем» (скелетон) */
.ai-thinking { animation: aiFade .2s ease; }
.ai-thinking .ai-badge { margin-bottom: 18px; }
.ai-skel { border-radius: var(--r-md); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 220% 100%; animation: aiShimmer 1.2s linear infinite; border: 1px solid var(--border); }
.ai-skel--understood { height: 52px; margin-bottom: 18px; }
.ai-skel__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.ai-skel--card { height: 184px; }
@media (max-width: 900px) { .ai-skel__row { grid-template-columns: 1fr; } }

/* кнопка «Новый запрос» в шапке результата */
.ai-newq { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .14s, color .14s, background .14s; }
.ai-newq:hover { border-color: var(--accent-line); color: var(--accent-2); background: var(--accent-soft); }

@keyframes aiFade { from { opacity: 0; transform: translateY(6px); } }
@keyframes aiShimmer { to { background-position: -220% 0; } }

.ai-sol { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.ai-sol__main { flex: 1; padding: 16px 18px; min-width: 0; }
.ai-sol__bar { width: 5px; flex: none; background: var(--surface-3); display: flex; align-items: flex-end; }
.ai-sol__bar span { width: 100%; display: block; border-radius: 5px 5px 0 0; transition: height .6s ease; }
.ai-tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.ai-match { display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.1; }
.ai-match b { font-size: 18px; font-weight: 800; color: #fff; }
.ai-match span { font-size: 10.5px; color: var(--text-mute); }

.ai-file { display: flex; align-items: center; gap: 12px; padding: 12px 13px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.ai-file__ic { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }

.ai-obj { border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); transition: border-color .14s; }
.ai-obj:hover { border-color: var(--border-2); }
.ai-obj__img { height: 120px; background-size: cover; background-position: center; }
.ai-obj__b { padding: 12px 14px; }


/* ===== layouts.css ===== */
/* ============================================================
   ФУНКЦИЯ — screen layouts
   ============================================================ */

/* grids */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.orders-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .orders-grid { grid-template-columns: 1fr; } }

.link { color: var(--accent-2); cursor: pointer; font-weight: 600; }
.link:hover { text-decoration: underline; }
.overline { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); }

/* ---------- Landing ---------- */
.landing { display: flex; flex-direction: column; height: 100vh; background: radial-gradient(120% 80% at 70% -10%, rgba(139,108,242,.16), transparent 55%), var(--bg); }
.landing__top { height: 76px; display: flex; align-items: center; gap: 20px; padding: 0 34px; flex-shrink: 0; }
.landing__scroll { flex: 1; overflow-y: auto; }
.landing__wrap { max-width: 1280px; margin: 0 auto; padding: 30px 40px 40px; }
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 60px; align-items: start; margin-bottom: 56px; }
.hero__title { font-size: 52px; font-weight: 800; line-height: 1.08; letter-spacing: -.025em; margin: 12px 0 0; color: #fff; }
.hero__sub { color: var(--text-dim); font-size: 16.5px; line-height: 1.6; max-width: 520px; margin-top: 22px; }
.hero__form { background: rgba(19,19,32,.7); backdrop-filter: blur(8px); }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.feature { display: flex; flex-direction: column; min-height: 230px; position: relative; overflow: hidden; }
.feature::after {
  content: ""; position: absolute; top: -50px; right: -50px; width: 180px; height: 180px;
  background: radial-gradient(circle, var(--fc, var(--accent)) 0%, transparent 68%);
  opacity: .07; pointer-events: none; transition: opacity .28s ease;
}
.feature.card-hover:hover::after { opacity: .16; }
.feature__icon {
  width: 56px; height: 56px; border-radius: 16px;
  display: grid; place-items: center; margin-bottom: 20px; position: relative; z-index: 1;
  background: color-mix(in srgb, currentColor 15%, transparent);
  border: 1px solid color-mix(in srgb, currentColor 32%, transparent);
  box-shadow: 0 10px 26px -12px color-mix(in srgb, currentColor 70%, transparent),
              inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent);
  transition: transform .2s ease, box-shadow .2s ease;
}
.feature.card-hover:hover .feature__icon {
  transform: translateY(-3px);
  box-shadow: 0 16px 32px -10px color-mix(in srgb, currentColor 80%, transparent),
              inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent);
}
.feature__desc { font-size: 13.5px; line-height: 1.5; margin: 8px 0 16px; flex: 0 0 auto; }
.feature__cta { margin-top: auto; display: inline-flex; align-items: center; gap: 7px; color: var(--accent-2); font-weight: 600; font-size: 14px; }
.feature--all { grid-column: span 1; justify-content: space-between; background: linear-gradient(150deg, var(--surface) 0%, rgba(139,108,242,.1) 100%); }
.landing__legend { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 22px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
.landing__legend span { display: inline-flex; align-items: center; gap: 7px; }
.landing__legend i { width: 7px; height: 7px; border-radius: 50%; }
@media (max-width: 980px) { .hero { grid-template-columns: 1fr; gap: 32px; } .hero__title { font-size: 40px; } .features { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .landing__top { height: 64px; padding: 0 18px; }
  .landing__wrap { padding: 18px 18px 28px; }
  .hero { gap: 24px; margin-bottom: 40px; }
  .hero__title { font-size: 32px; }
  .hero__sub { font-size: 15px; margin-top: 16px; }
  .hero__right .chars-embed { margin-right: 8px !important; }
}

/* ---------- Auth ---------- */
.auth { height: 100vh; display: grid; place-items: center; background: radial-gradient(100% 100% at 50% 0%, rgba(139,108,242,.12), transparent 50%), var(--bg); padding: 24px; }
.auth__card { width: 100%; max-width: 440px; padding: 34px; }

/* ---------- Split login with animated characters ---------- */
.authx { height: 100vh; display: grid; grid-template-columns: 1.05fr .95fr; background: var(--bg); overflow: hidden; }
@media (max-width: 900px) { .authx { grid-template-columns: 1fr; } .authx__brand { display: none; } }

.authx__brand { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 36px; overflow: hidden;
  background: linear-gradient(150deg, var(--accent) 0%, var(--accent-2) 55%, color-mix(in srgb, var(--accent) 70%, #000) 100%); color: #fff; }
.authx__top { display: inline-flex; align-items: center; gap: 12px; position: relative; z-index: 3; cursor: pointer; width: max-content; }
.authx__top .brand__name { color: #fff; }
.authx__top .brand__logo { background: rgba(255,255,255,.16); }
.authx__foot { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.authx__foot .dim { color: rgba(255,255,255,.6); }
.authx__glow { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; }
.authx__glow--1 { width: 320px; height: 320px; top: -60px; right: -40px; background: rgba(255,255,255,.16); }
.authx__glow--2 { width: 420px; height: 420px; bottom: -120px; left: -80px; background: rgba(0,0,0,.18); }

.authx__stage { position: relative; z-index: 2; flex: 1; display: flex; align-items: flex-end; justify-content: center; min-height: 0; }
.chars { position: relative; width: 480px; height: 360px; }
/* embeddable, scalable version of the login mascots for use on other pages */
.chars-embed { position: relative; }
.chars-embed .chars { position: absolute; top: 0; left: 0; }
.char { position: absolute; bottom: 0; transition: transform .6s ease, height .6s ease; transform-origin: bottom center; }
.char__eyes { position: absolute; display: flex; left: 30px; top: 38px; transition: left .55s ease, top .55s ease; }
.char--purple { left: 86px; width: 158px; height: 320px; background: #8b6cf2; border-radius: 14px 14px 0 0; z-index: 1; box-shadow: inset 0 2px 0 rgba(255,255,255,.18); }
.char--purple .char__eyes { left: 44px; }
.char--dark   { left: 224px; width: 104px; height: 250px; background: #232333; border-radius: 12px 12px 0 0; z-index: 2; }
.char--dark .char__eyes { left: 26px; }
.char--amber  { left: 6px; width: 210px; height: 168px; background: #f0a94b; border-radius: 110px 110px 0 0; z-index: 3; }
.char--rose   { left: 286px; width: 126px; height: 196px; background: #ef6f9e; border-radius: 64px 64px 0 0; z-index: 4; }
.char__mouth { position: absolute; left: 38px; top: 88px; width: 56px; height: 4px; border-radius: 4px; background: #2d2d2d; }

.eye { background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: height .15s ease; }
.pupil { background: #2d2d2d; border-radius: 50%; transition: transform .1s ease-out; }
.pupil--bare { }

.authx__form { display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); }
.authx__formwrap { width: 100%; max-width: 380px; }
.authx__head { text-align: center; }
.inputwrap { position: relative; }
.inputwrap .input { width: 100%; padding-right: 44px; }
.inputwrap__btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-mute); cursor: pointer; border-radius: 8px; }
.inputwrap__btn:hover { color: var(--text); }

/* ---------- Empty state ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 70px 24px; background: var(--surface); border: 1px dashed var(--border-2); border-radius: var(--r-lg); }
.empty__icon { width: 66px; height: 66px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent-2); margin-bottom: 18px; }

/* ---------- Order card ---------- */
.ordercard { display: flex; gap: 20px; align-items: stretch; }
.ordercard__thumb { width: 150px; height: 130px; align-self: stretch; }
.ordercard__thumb--img {
  width: 150px; align-self: stretch; border-radius: var(--r-md);
  background-size: cover; background-position: center; background-repeat: no-repeat;
  border: 1px solid var(--border); flex-shrink: 0;
}
@media (max-width: 720px) { .ordercard__thumb--img { width: 100%; height: 120px; } }
.ordercard__title { font-size: 17px; font-weight: 700; margin: 0; color: #fff; line-height: 1.3; }
.ordercard__desc { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; margin: 8px 0 0; max-width: 820px; }
@media (max-width: 720px) { .ordercard { flex-direction: column; } .ordercard__thumb { width: 100%; height: 120px; } }

/* ---------- Dropdown ---------- */
.menu-pop { position: absolute; top: calc(100% + 6px); left: 0; min-width: 180px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 6px; z-index: 30; box-shadow: var(--shadow); }
.menu-pop__item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-dim); font-size: 13.5px; padding: 9px 12px; border-radius: 7px; }
.menu-pop__item:hover { background: var(--surface-3); color: var(--text); }
.menu-pop__item.is-sel { color: var(--accent-2); }

/* ---------- Breadcrumb ---------- */
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-dim); }

/* ---------- Detail ---------- */
.detail__hero { height: 230px; margin-bottom: 24px; }
.detail__hero--img {
  height: 300px; border-radius: var(--r-md); margin-bottom: 24px;
  background-size: cover; background-position: center;
  background-repeat: no-repeat; position: relative; overflow: hidden;
  border: 1px solid var(--border);
}
.detail__hero--img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(10,10,18,.55));
}
.detail__hero-tag {
  position: absolute; left: 16px; bottom: 14px; z-index: 1;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 99px;
  background: rgba(12,12,20,.62); border: 1px solid rgba(255,255,255,.14);
  color: #fff; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(8px);
}
.detail__grid { display: grid; grid-template-columns: 1fr 360px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .detail__grid { grid-template-columns: 1fr; } }
.spec { width: 100%; border-collapse: collapse; }
.spec td { padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; vertical-align: top; }
.spec td:first-child { color: var(--text-dim); width: 150px; }
.spec td:last-child { color: var(--text); font-weight: 500; }
.spec tr:last-child td { border-bottom: none; }

/* timeline */
.timeline { display: flex; flex-direction: column; }
.tl { position: relative; padding: 0 0 26px 32px; }
.tl:last-child { padding-bottom: 0; }
.tl__dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--border-2); display: grid; place-items: center; color: #fff; z-index: 2; }
.tl--done .tl__dot { background: var(--green); border-color: var(--green); }
.tl__line { position: absolute; left: 10px; top: 22px; bottom: 4px; width: 2px; background: var(--border-2); }
.tl--done .tl__line { background: var(--green); }
.tl__label { font-size: 14.5px; padding-top: 1px; color: var(--text); }
.tl:not(.tl--done) .tl__label { color: var(--text-mute); }

/* team */
.team { display: flex; flex-direction: column; }
.team__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; cursor: pointer; }
.team__row:last-child { border-bottom: none; }
.team__row:hover { color: var(--accent-2); }
.team__ava { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; color: var(--accent-2); }

/* ---------- Create order ---------- */
.stepper { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
.stepper__item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); color: var(--text-mute); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.stepper__item.is-active { border-color: var(--accent-line); color: var(--text); background: var(--accent-soft); }
.stepper__item.is-done { color: var(--green); }
.stepper__num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

/* ---------- Pricing / Тарифы ---------- */
.pricing-head { text-align: center; max-width: 760px; margin: 0 auto 36px; }
.billtoggle { display: inline-flex; gap: 4px; margin-top: 26px; padding: 4px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
.billtoggle__opt { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 99px; border: 0; background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .16s, color .16s; }
.billtoggle__opt.is-active { background: var(--grad); color: #fff; }
.billtoggle__save { font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.18); }
.billtoggle__opt:not(.is-active) .billtoggle__save { background: var(--accent-soft); color: var(--accent-2); }

.pricing-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 1180px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .pricing-grid { grid-template-columns: 1fr; } }

.plan {
  position: relative; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg, 20px);
  padding: 26px 22px; overflow: hidden; transition: transform .2s ease, border-color .2s ease;
}
.plan::after {
  content: ""; position: absolute; top: -60px; right: -60px; width: 180px; height: 180px;
  background: radial-gradient(circle, var(--fc) 0%, transparent 68%); opacity: .07; pointer-events: none;
}
.plan:hover { border-color: var(--border-2); }
.plan--pop { border-color: var(--accent-line); border-width: 1.5px; transform: translateY(-10px); box-shadow: 0 24px 60px -28px var(--accent); }
.plan--pop::after { opacity: .14; }
.plan__badge {
  position: absolute; top: 0; right: 0; display: inline-flex; align-items: center; gap: 5px;
  background: var(--grad); color: #fff; font-size: 12px; font-weight: 700;
  padding: 6px 12px; border-bottom-left-radius: 14px; border-top-right-radius: 18px;
}
.plan__icon {
  width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 16px;
  background: color-mix(in srgb, currentColor 15%, transparent);
  border: 1px solid color-mix(in srgb, currentColor 32%, transparent);
  box-shadow: 0 10px 24px -12px color-mix(in srgb, currentColor 70%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent);
}
.plan__role { font-size: 19px; font-weight: 800; color: #fff; }
.plan__tag { color: var(--text-dim); font-size: 13px; line-height: 1.45; margin: 6px 0 18px; min-height: 36px; }
.plan__price { display: flex; align-items: baseline; gap: 2px; }
.plan__amount { font-size: 34px; font-weight: 800; color: #fff; letter-spacing: -.01em; font-variant-numeric: tabular-nums; display: inline-block; }
.num-pop { animation: numPop .34s cubic-bezier(.2,.7,.3,1); }
@keyframes numPop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.plan__cur { font-size: 20px; font-weight: 700; color: #fff; }
.plan__per { font-size: 14px; font-weight: 600; color: var(--text-mute); margin-left: 4px; }
.plan__billed { font-size: 12.5px; color: var(--text-mute); margin-top: 4px; }
.plan__feats { list-style: none; padding: 0; margin: 20px 0; display: flex; flex-direction: column; gap: 11px; flex: 1; }
.plan__feats li { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; line-height: 1.4; color: var(--text); }
.plan__check { flex: none; width: 20px; height: 20px; border-radius: 6px; margin-top: 1px; display: grid; place-items: center; background: color-mix(in srgb, var(--fc) 16%, transparent); color: var(--fc); }
.plan__cta { margin-top: auto; height: 46px; font-size: 14.5px; }
.pricing-foot { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 30px; color: var(--text-mute); font-size: 13.5px; }
.stepper__item.is-active .stepper__num { background: var(--grad); color: #fff; }
.stepper__item.is-done .stepper__num { background: var(--green); color: #fff; }
.newgrid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .newgrid { grid-template-columns: 1fr; } }
.selectcard { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 9px; padding: 16px 16px 17px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; transition: border-color .14s, background .14s; }
.selectcard:hover { border-color: var(--border-2); }
.selectcard.is-sel { border-color: rgba(240,169,75,.5); background: rgba(240,169,75,.13); }
.selectcard__ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-dim); transition: background .14s, color .14s; }
.selectcard.is-sel .selectcard__ic { background: rgba(240,169,75,.22); color: #f0a94b; }
.selectcard b { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.25; }
.selectcard.is-sel b { color: #fff; }
.selectcard .sc-d { font-size: 12px; font-weight: 400; color: var(--text-mute); line-height: 1.4; }
/* amber pill group — colour of the yellow mascot (назначение объекта) */
.pillpick--amber .pill.is-active { background: rgba(240,169,75,.14); border-color: rgba(240,169,75,.5); color: #f0a94b; }

/* preview cover — mascots scene (заявка) */
.prev__cover { position: relative; height: 144px; margin-bottom: 16px; border-radius: var(--r-md); overflow: hidden;
  background: radial-gradient(115% 130% at 50% 118%, rgba(240,169,75,.22), rgba(240,169,75,.05) 46%, transparent 72%), var(--surface-2);
  border: 1px solid var(--border); display: grid; place-items: end center; }
.hintbar { display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--blue); font-size: 13px; line-height: 1.5; color: var(--text-dim); }

.nb-drawer__h { margin: 22px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-mute); }
.nb-drawer__scope { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text); }
.nb-drawer__foot { flex: none; display: flex; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--border); }
.nb-alert { display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border: 1px solid; border-radius: var(--r-md); margin-top: 20px; font-size: 13px; line-height: 1.5; color: var(--text); }
.nb-point { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.nb-point .chip-code { flex: none; }
.nb-point__t { font-size: 13px; line-height: 1.5; color: var(--text); }
@keyframes nbFade { from { opacity: 0; } }
@keyframes nbSlide { from { transform: translateX(40px); opacity: 0; } }

/* область чтения документа */
.nb-reader { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 130; display: flex; flex-direction: column; background: var(--bg); animation: nbFade .2s ease; }
.nb-reader__top { flex: none; display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 22px; border-bottom: 1px solid var(--border); background: var(--bg-2); }
.nb-reader__back { display: inline-flex; align-items: center; gap: 7px; background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 8px 10px; border-radius: var(--r-sm); }
.nb-reader__back:hover { color: var(--text); background: var(--surface-2); }
.nb-reader__crumb { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text); }
.nb-reader__crumb b { font-weight: 700; font-variant-numeric: tabular-nums; }
.nb-reader__crumb .dim { font-size: 12px; }
.nb-reader__main { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px 1fr; }
.nb-reader__toc { border-right: 1px solid var(--border); padding: 26px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.nb-reader__toch { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; padding-left: 10px; }
.nb-reader__tocitem { display: flex; align-items: center; gap: 11px; text-align: left; width: 100%; padding: 9px 11px; border: none; background: none; color: var(--text-dim); font-family: inherit; font-size: 13.5px; cursor: pointer; border-radius: var(--r-sm); transition: background .14s, color .14s; }
.nb-reader__tocitem:hover { background: var(--surface-2); color: var(--text); }
.nb-reader__tocn { flex: none; min-width: 18px; font-size: 12px; font-weight: 700; color: var(--text-mute); }
.nb-reader__tocsub { font-size: 12.5px; padding-left: 14px; color: var(--text-mute); }
.nb-reader__tocsub .nb-reader__tocn { color: var(--accent-2); }
.nb-reader__scroll { overflow-y: auto; padding: 44px 32px 80px; }
.nb-reader__doc { max-width: 760px; margin: 0 auto; position: relative; color: var(--text); }
.nb-reader__dochead { padding-bottom: 26px; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
.nb-reader__dochead .nb-status--badge { margin-bottom: 16px; }
.nb-reader__code { font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.nb-reader__title { font-size: 30px; line-height: 1.2; font-weight: 700; margin: 0 0 14px; letter-spacing: -.01em; text-wrap: balance; }
.nb-reader__meta { font-size: 13px; color: var(--text-mute); }
.nb-reader__alert { margin: 0 0 28px; }
.nb-reader__sec { margin-bottom: 34px; scroll-margin-top: 18px; }
.nb-reader__sec h2 { display: flex; align-items: baseline; gap: 12px; font-size: 19px; font-weight: 700; margin: 0 0 14px; letter-spacing: -.01em; }
.nb-reader__secn { flex: none; min-width: 26px; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.nb-reader__sec p { margin: 0 0 14px; font-size: 15.5px; line-height: 1.75; color: var(--text); text-wrap: pretty; }
.nb-reader__sec p.dim { color: var(--text-mute); }
.nb-reader__refs { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.nb-reader__refs li { font-size: 14.5px; line-height: 1.55; color: var(--text-dim); padding-left: 16px; position: relative; }
.nb-reader__refs li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); }
.nb-reader__refs b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.nb-reader__clause { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 4px 0 16px; }
.nb-reader__cnum { font-size: 13.5px; font-weight: 700; color: var(--accent-2); font-variant-numeric: tabular-nums; padding-top: 2px; }
.nb-reader__clause p { margin: 0; font-size: 15.5px; line-height: 1.75; color: var(--text); text-wrap: pretty; }
.nb-reader__end { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-mute); font-style: italic; }
@media (max-width: 820px) { .nb-reader__main { grid-template-columns: 1fr; } .nb-reader__toc { display: none; } .nb-reader__scroll { padding: 30px 20px 60px; } .nb-reader__title { font-size: 25px; } }

</style>
<style>
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;}
  /* стейдж для презентации блока вне приложения */
  #root{display:block;}
  #root .solm{padding:40px 20px;}
  /* блок показываем вне приложения статично — без анимации входа */
  #root .solm, #root .solm__panel{animation:none !important;opacity:1 !important;transform:none !important;}
</style>

    check:     <><path d="M5 12.5l4.5 4.5L19 7"/></>,

    target:    <><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></>,
    users:     <><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 19a5.5 5.5 0 0 0-3-4.9"/></>,
    rocket:    <><path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2a2.8 2.8 0 0 0-3-3z"/><path d="M9 14l-3-3c1.5-5 5-8 11-8 0 6-3 9.5-8 11z"/><circle cx="14.5" cy="9.5" r="1.4"/></>,
    calendar:  <><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></>,
    layers:    <><path d="M12 3l8.5 4.5L12 12 3.5 7.5z"/><path d="M3.5 12L12 16.5 20.5 12M3.5 16.5L12 21l8.5-4.5"/></>,
    cpu:       <><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2"/></>,
    box:       <><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></>,
    award:     <><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5L17 21l-1.5-7.5"/></>,
    bell:      <><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></>,
    eye:       <><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></>,
    eyeOff:    <><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.4 5.4A9.3 9.3 0 0 1 12 5c6 0 9.5 7 9.5 7a16.6 16.6 0 0 1-2.6 3.4M6.3 6.3A16.4 16.4 0 0 0 2.5 12S6 19 12 19a9.2 9.2 0 0 0 3.9-.9"/></>,

    bim:       <><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 8h3.5a2 2 0 0 1 0 4H8zM8 12h4a2 2 0 0 1 0 4H8zM8 8v8M15 8v8"/></>,

    ruble:     <><path d="M8 21V4h5a4.5 4.5 0 0 1 0 9H8M6 13h7M6 17h6"/></>,

    bulb:      <><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.2-1 2H9c0-.8-.3-1.4-1-2A6 6 0 0 1 12 3z"/></>,
    trendUp:   <><path d="M4 17l5-5 3 3 8-8M16 7h4v4"/></>,
    trendDown: <><path d="M4 7l5 5 3-3 8 8M16 17h4v-4"/></>,
    x:         <><path d="M6 6l12 12M18 6L6 18"/></>,
    arrowUp:   <><path d="M12 19V5M6 11l6-6 6 6"/></>,
  };
  function Icon({ name, size = 20, style, className, strokeWidth }) {
    const d = paths[name];
    if (!d) return null;
    const p = strokeWidth ? { ...P, strokeWidth } : P;
    return (
      <svg viewBox="0 0 24 24" width={size} height={size} style={style} className={className} {...p}>{d}</svg>
    );
  }
  window.Icon = Icon;

  /* Brand mark — abstract violet "F" (stem + two arms + dot) */
  function FuncMark({ size = 32, light = false, style, className }) {
    const fill = light ? "#fff" : "url(#fmgrad)";
    return (
      <svg viewBox="0 0 44 48" width={Math.round(size * 44 / 48)} height={size} style={style} className={className} fill="none">
        {!light && (
          <defs>
            <linearGradient id="fmgrad" x1="8" y1="6" x2="34" y2="42" gradientUnits="userSpaceOnUse">
              <stop stopColor="#b6a0ff" />
              <stop offset="1" stopColor="#7c5cf0" />
            </linearGradient>
          </defs>
        )}
        <rect x="8" y="8" width="7" height="23" rx="3.5" fill={fill} />
        <rect x="8" y="8" width="30" height="7" rx="3.5" fill={fill} />
        <rect x="8" y="20.5" width="21" height="7" rx="3.5" fill={fill} />
        <circle cx="11.5" cy="38.5" r="4.3" fill={fill} />
      </svg>
    );
  }
  window.FuncMark = FuncMark;
})();

</script>
<script type="text/babel" data-presets="react">
(function(){
  const { useState } = React;
  const Icon = window.Icon;
  const grad = (a,b)=>({ background: "linear-gradient(135deg, "+a+", "+b+")" });

  const m = {
    n:"Ридан", cat:"Инженерные системы", sub:"Отопление и теплоснабжение",
    logo: window.IMG.logo, d:"Теплообменники, тепловые пункты и автоматика",
    tag:"BIM", rating:"4.8", geo:"РФ", g:["#19b39a","#0e8f7d"],
    det:{
      founded:"1993",
      analogs:["Аналог Danfoss","Аналог Alfa Laval"],
      registry:"Реестр Минпромторга",
      sections:"ОВ · ТМ · ВК",
      respond:"~4 ч",
      sysTypes:["ИТП","Теплоснабжение","Отопление","Вентиляция","ГВС"],
      about:"Российский производитель тепломеханического оборудования (преемник производства Danfoss в России): пластинчатые теплообменники, блочные индивидуальные тепловые пункты и тепловая автоматика. Производство — в Дзержинске Нижегородской области.",
      tasks:["Подбор и замена импортных теплообменников в существующей схеме","Проектирование и комплектация ИТП под нагрузку объекта","Балансировка и автоматика систем отопления и теплоснабжения"],
      facts:[["Программа подбора","Есть · по запросу"],["BIM / CAD","44 модели · Revit, IFC"],["Тип объектов","Жильё · промышленность"]],
      trust:"Производство — Дзержинск, сервис по РФ",
      products:["Пластинчатые теплообменники","Блочные тепловые пункты","Тепловая автоматика","Балансировочная арматура"],
      certs:["ТР ТС","ISO 9001:2015","Протоколы испытаний"],
      bim:44,
      gallery:[[window.IMG.hex,"Пластинчатый теплообменник"],[window.IMG.valve,"Балансировочный клапан MVT"],[window.IMG.vf,"Регулирующий клапан VF"]]
    }
  };
  const CONTACT = { site:"ridan.ru", phone:"+7 800 700-88-85", email:"info@ridan.ru", hq:"Дзержинск, Нижегородская обл., Восточное ш., 12" };

  function ReqForm({ det }) {
    const [sent, setSent] = useState(false);
    const [file, setFile] = useState(false);
    const secOpts = (det.sections || "").split("·").map(s => s.trim()).filter(Boolean);
    const SEC_LABELS = { "ОВ": "ОВ — отопление и вентиляция", "ТМ": "ТМ — теплоснабжение", "ВК": "ВК — водоснабжение", "КР": "КР — конструкции", "АР": "АР — архитектура" };
    if (sent) return (
      <div className="solm__reqdone">
        <div className="solm__reqdone-ic"><Icon name="check" size={20} /></div>
        <div><b>Запрос отправлен</b><span>Техотдел ответит примерно за {det.respond || "1 рабочий день"}.</span></div>
      </div>
    );
    return (
      <div className="solm__reqform">
        <div className="solm__reqhead">
          <h4 className="solm__h" style={{ margin: 0 }}>Запрос техотделу</h4>
          {det.respond && <span className="solm__respond"><Icon name="clock" size={12} />Отвечает за {det.respond}</span>}
        </div>
        <div className="solm__reqrow">
          <select className="solm__select" defaultValue={secOpts[0] ? "Раздел: " + (SEC_LABELS[secOpts[0]] || secOpts[0]) : ""}>
            {secOpts.map(s => <option key={s}>{"Раздел: " + (SEC_LABELS[s] || s)}</option>)}
          </select>
          <select className="solm__select" defaultValue={det.sysTypes && det.sysTypes[0] ? "Тип системы: " + det.sysTypes[0] : ""}>
            {(det.sysTypes || []).map(s => <option key={s}>{"Тип системы: " + s}</option>)}
          </select>
        </div>
        <textarea className="solm__reqarea" placeholder="Кратко опишите задачу: нагрузка, среда, габариты, что нужно подобрать или заменить…"></textarea>
        <div className="solm__reqactions">
          <button type="button" className={"solm__attach" + (file ? " is-on" : "")} onClick={() => setFile(true)}><Icon name={file ? "check" : "portfolio"} size={15} />{file ? "Опросный лист прикреплён" : "Прикрепить опросный лист"}</button>
          <button type="button" className="solm__send" onClick={() => setSent(true)}>Отправить запрос</button>
        </div>
      </div>
    );
  }

  function Card() {
    const det = m.det || {};
    return (
      <div className="solm" style={{ position:"relative", inset:"auto", minHeight:"100vh" }}>
        <div className="solm__panel" onClick={e => e.stopPropagation()}>
          <button className="solm__close" aria-label="Закрыть"><Icon name="x" size={18} /></button>
          <div className="solm__head solm__head--brand" style={{ background: "linear-gradient(135deg, color-mix(in srgb, "+m.g[0]+" 20%, var(--surface)), var(--surface) 64%)" }}>
            <div className="solm__brandrow">
              {m.logo
                ? <div className="solm__brandlogo"><img src={m.logo} alt={m.n} /></div>
                : <div className="solm__brandava" style={grad(m.g[0], m.g[1])}><Icon name="factory" size={34} /></div>}
              <div style={{ minWidth: 0 }}>
                <h2 className="solm__title" style={{ margin: 0 }}>{m.n}</h2>
                <p className="solm__brandsub">{m.d}</p>
                <div className="row gap10 dim" style={{ fontSize: 13, marginTop: 8, flexWrap: "wrap" }}><span className="row gap5"><Icon name="star" size={13} style={{ color: "var(--amber)" }} />{m.rating}</span><span className="row gap5"><Icon name="pin" size={13} />{m.geo}</span>{det.founded && <span className="row gap5"><Icon name="calendar" size={13} />с {det.founded}</span>}</div>
              </div>
            </div>
            <div className="chips" style={{ marginTop: 14 }}><span className="chip chip-code">{m.cat}</span><span className="chip">{m.tag}</span>{det.bim != null && <span className="chip"><Icon name="layers" size={12} /> {det.bim} BIM-моделей</span>}</div>
            <div className="solm__stats">
              {det.founded && <div className="solm__stat"><b>{det.founded}</b><span>год основания</span></div>}
              {det.bim != null && <div className="solm__stat"><b>{det.bim}</b><span>BIM-моделей</span></div>}
              <div className="solm__stat"><b>{m.rating}</b><span>рейтинг</span></div>
              <div className="solm__stat"><b>{m.geo}</b><span>география</span></div>
            </div>
          </div>

          <div className="solm__body">
            {(det.analogs || det.registry || det.sections) && <div className="solm__keychips">
              {(det.analogs || []).map(a => <span key={a} className="solm__kchip solm__kchip--analog">{a}</span>)}
              {det.registry && <span className="solm__kchip solm__kchip--reg"><Icon name="check" size={12} />{det.registry}</span>}
              {det.sections && <span className="solm__kchip">Разделы: {det.sections}</span>}
            </div>}

            {det.tasks ? <div className="solm__sec">
              <h4 className="solm__h">Какие задачи решаем</h4>
              <div className="solm__tasks">{det.tasks.map(t => <div key={t} className="solm__task"><Icon name="check" size={16} /><span>{t}</span></div>)}</div>
            </div> : det.products && <div className="solm__sec">
              <h4 className="solm__h">Продукция</h4>
              <div className="solm__params">{det.products.map(p => <div key={p} className="solm__param" style={{ flexDirection: "row", alignItems: "center", gap: 9 }}><Icon name="box" size={15} style={{ color: "var(--accent-2)", flex: "none" }} /><b style={{ fontSize: 13 }}>{p}</b></div>)}</div>
            </div>}

            {det.facts && <div className="solm__sec">
              <div className="solm__factgrid">{det.facts.map(([k, v]) => <div key={k} className="solm__factcell"><span className="dim">{k}</span><b>{v}</b></div>)}</div>
            </div>}

            {det.certs && (det.trust ? <div className="solm__sec">
              <h4 className="solm__h">Доверие</h4>
              <div className="solm__trustline">{det.certs.map(c => <span key={c} className="solm__trustitem"><Icon name="check" size={13} />{c}</span>)}<span className="solm__trustitem"><Icon name="pin" size={13} />{det.trust}</span></div>
            </div> : <div className="solm__sec">
              <h4 className="solm__h">Сертификаты и документы</h4>
              <ul className="solm__pros">{det.certs.map(c => <li key={c}><Icon name="check" size={15} />{c}</li>)}</ul>
            </div>)}

            {det.gallery && det.gallery.length > 0 && <div className="solm__sec">
              <h4 className="solm__h">Примеры продукции</h4>
              <div className="solm__gallery">{det.gallery.map(([img, name]) => <figure key={name} className="solm__gphoto">{img ? <div className="solm__gphoto-img" style={{ backgroundImage: "url('" + img + "'), linear-gradient(140deg, #e8eaff 0%, #f3edfb 48%, #ffe9e0 100%)" }} /> : <div className="solm__gphoto-img solm__gphoto-ph"><Icon name="box" size={30} /><span>фото скоро</span></div>}<figcaption>{name}</figcaption></figure>)}</div>
            </div>}

            {det.about && <div className="solm__sec"><h4 className="solm__h">О производителе</h4><p className="muted" style={{ margin: 0, fontSize: 13.5, lineHeight: 1.55 }}>{det.about}</p></div>}

            <div className="solm__sec">
              <h4 className="solm__h">Контакты</h4>
              <div className="solm__contacts">
                <a className="solm__contact" href={"https://" + CONTACT.site} target="_blank" rel="noopener noreferrer"><span className="solm__contact-ic"><Icon name="globe" size={16} /></span><span className="solm__contact-b"><span className="dim">Сайт</span><b>{CONTACT.site}</b></span><Icon name="arrowRight" size={14} className="solm__contact-go" /></a>
                <a className="solm__contact" href={"tel:" + CONTACT.phone.replace(/[^+\d]/g, "")}><span className="solm__contact-ic"><Icon name="phone" size={16} /></span><span className="solm__contact-b"><span className="dim">Телефон</span><b>{CONTACT.phone}</b></span></a>
                <a className="solm__contact" href={"mailto:" + CONTACT.email}><span className="solm__contact-ic"><Icon name="mail" size={16} /></span><span className="solm__contact-b"><span className="dim">Email</span><b>{CONTACT.email}</b></span></a>
                <a className="solm__contact" href={"https://yandex.ru/maps/?text=" + encodeURIComponent(CONTACT.hq)} target="_blank" rel="noopener noreferrer"><span className="solm__contact-ic"><Icon name="pin" size={16} /></span><span className="solm__contact-b"><span className="dim">Адрес · на карте</span><b>{CONTACT.hq}</b></span><Icon name="arrowRight" size={14} className="solm__contact-go" /></a>
              </div>
            </div>

            {det.tasks && <ReqForm det={det} />}
          </div>

          <div className="solm__foot">
            <button className="btn btn-ghost">Закрыть</button>
            <div className="row gap8">
              <button className="btn btn-ghost"><Icon name="download" size={15} /> Скачать BIM</button>
              <button className="btn btn-primary"><Icon name="chat" size={15} /> Связаться</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
})();
</script>
